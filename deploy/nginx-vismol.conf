server {
    listen 443 ssl;
    server_name vismol.kevinzhu.me;
    include /etc/nginx/snippets/cloudflare-only.conf;
    ssl_certificate /etc/letsencrypt/live/vismol.kevinzhu.me/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/vismol.kevinzhu.me/privkey.pem; # managed by Certbot
    root /opt/docker/vismol-site;
    index index.html;

    # Cabeceras de seguridad: en Nginx, un add_header dentro de un location
    # anula TODOS los heredados del server, así que se repiten en cada bloque
    # que agregue los suyos (antes /assets/ salía sin ellas).
    # CSP: solo el propio sitio y el PDB (de donde se bajan las moléculas).
    # 'wasm-unsafe-eval' lo pide el decodificador meshopt de los modelos de células,
    # y blob: en connect-src, el cargador de modelos para leer sus texturas internas.
    # Cloudflare inyecta su analítica (Web Analytics): se permite para no cortarla.
    set $csp "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self' blob: https://files.rcsb.org; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'";

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Security-Policy $csp always;
        try_files $uri $uri/ /index.html;
    }
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Security-Policy $csp always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    # Modelos de células: nombres sin hash, así que caché de una semana y no inmutable.
    location /celulas/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Security-Policy $csp always;
        add_header Cache-Control "public, max-age=604800";
        types { model/gltf-binary glb; image/webp webp; }
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml model/gltf-binary;
}
server {
    if ($host = vismol.kevinzhu.me) {
        return 301 https://$host$request_uri;
    } # managed by Certbot
    listen 80;
    server_name vismol.kevinzhu.me;
    return 404; # managed by Certbot
}
